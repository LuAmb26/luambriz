<noscript><p>This site needs JavaScript. <a href="https://luamb26.github.io/luambriz/">Open it directly</a>.</p></noscript>
<script>
/* https://luambriz.ar.io/ shows the site hosted on GitHub Pages (https://luamb26.github.io/luambriz/) in a full-window frame,
   so updates pushed to GitHub appear here without re-publishing this page.
   Deep links work both ways: https://luambriz.ar.io/#physical opens that section, and the address bar
   follows the section open in the frame. */
(function () {
  var SITE = 'https://luamb26.github.io/luambriz/', ORIGIN = 'https://luamb26.github.io';
  var frame = document.getElementById('site');
  var safe = function (h) { return /^#[A-Za-z0-9_.\-]*$/.test(h) ? h : ''; };
  frame.src = SITE + safe(location.hash);
  addEventListener('message', function (e) {
    if (e.origin !== ORIGIN || !e.data || e.data.luambriz !== 'hash') return;
    var h = safe(String(e.data.hash || ''));
    if (h !== location.hash) history.replaceState(null, '', h || location.pathname + location.search);
  });
  addEventListener('hashchange', function () { frame.src = SITE + safe(location.hash); });
})();
</script>
